name: Auto-Generate Blog HTML

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Blog Pages
        run: npm run build

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add blogs/ sitemap.xml
          git commit -m "chore: auto-generate blog HTML and update sitemap [skip ci]" || echo "No changes to commit"
          git push origin main
